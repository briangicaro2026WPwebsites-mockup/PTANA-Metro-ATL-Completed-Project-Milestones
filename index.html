<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTANA Metro ATL - Completed Project Milestones</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            DEFAULT: '#1E3A8A',
                            dark: '#172554',
                            light: '#3B82F6'
                        },
                        amber: {
                            DEFAULT: '#D97706',
                            light: '#FBBF24',
                            dark: '#B45309'
                        },
                        slateBg: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white;
            }
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800">

    <!-- Header -->
    <header class="bg-navy text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-amber p-3 rounded-xl shadow text-white">
                        <i class="fa-solid fa-circle-check text-2xl"></i>
                    </div>
                    <div>
                        <span class="text-amber-light text-xs font-semibold tracking-wider uppercase">PTANA Metro Atlanta Chapter</span>
                        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Completed Project Milestones</h1>
                    </div>
                </div>
                <!-- Action Buttons: Invoice Link, Wise Pay & Print -->
                <div class="flex flex-wrap items-center gap-2.5 self-start md:self-auto no-print">
                    <a href="https://briangicaro2026wpwebsites-mockup.github.io/PTANA-Metro-ATL-Website-Development-Invoice-001/" class="bg-emerald-600 hover:bg-emerald-700 text-xs text-white px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm font-semibold">
                        <i class="fa-solid fa-file-invoice-dollar"></i> View Invoice & Wise Pay
                    </a>
                    <button onclick="window.print()" class="bg-navy-dark hover:bg-blue-900 text-xs text-slate-200 px-4 py-2.5 rounded-xl border border-blue-800 transition flex items-center gap-2 shadow-sm font-medium">
                        <i class="fa-solid fa-print"></i> Print Report
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Summary Metric Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-emerald-600">Total Completed Milestones</p>
                    <h3 class="text-3xl font-bold text-emerald-700 mt-1">13 <span class="text-xs font-normal text-slate-500">/ 28 Total</span></h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-square-check"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-navy">Core Pages Published</p>
                    <h3 class="text-3xl font-bold text-navy mt-1">11</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-blue-50 text-navy flex items-center justify-center text-xl">
                    <i class="fa-solid fa-globe"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-amber-600">Integrations & Mobile</p>
                    <h3 class="text-3xl font-bold text-amber-700 mt-1">2 <span class="text-xs font-normal text-slate-500">Verified</span></h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center md:justify-between gap-4 no-print">
            <div class="flex flex-wrap gap-2">
                <button onclick="filterCategory('all')" id="filter-all" class="filter-btn px-4 py-2 text-xs font-semibold rounded-xl bg-navy text-white transition shadow-sm">All Completed (13)</button>
                <button onclick="filterCategory('pages')" id="filter-pages" class="filter-btn px-4 py-2 text-xs font-semibold rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Pages & Content</button>
                <button onclick="filterCategory('technical')" id="filter-technical" class="filter-btn px-4 py-2 text-xs font-semibold rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Design & Tech</button>
            </div>
            <div class="relative w-full md:w-80">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch(event)" placeholder="Search completed milestones..." class="w-full pl-10 pr-4 py-2 text-xs sm:text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-navy focus:border-transparent bg-slate-50">
            </div>
        </div>

        <!-- Completed Tasks Grid -->
        <div id="completed-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Populated via JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-auto">
        <div class="max-w-7xl mx-auto px-4">
            <p>PTANA Metro Atlanta Chapter &bull; Completed Website Milestones Showcase &bull; Published & Verified</p>
        </div>
    </footer>

    <!-- JavaScript Dataset & Rendering -->
    <script>
        const completedTasks = [
            {
                id: 1,
                category: "technical",
                title: "Review and Complete Existing WordPress Website",
                desc: "Review the existing WordPress website and identify complete pages, content gaps, broken links, missing images, placeholder text, duplicate pages, menu issues, mobile display problems, outdated plugins, and form issues.",
                subitems: [
                    "Audit completed and successfully published",
                    "Identified incomplete pages and fixed broken links",
                    "Checked mobile display and navigation menu structure",
                    "Reviewed forms and plugins for security and performance"
                ],
                notes: "Initial audit successfully completed and published."
            },
            {
                id: 2,
                category: "technical",
                title: "Website Design and Branding",
                desc: "Ensure professional travel-industry appearance reflecting PTANA Metro ATL with consistent logo, brand colors, fonts, headings, buttons, image styles, and page layouts.",
                subitems: [
                    "Professional, modern, welcoming, travel-focused aesthetic",
                    "Consistent use of PTANA / Metro ATL logo and brand colors",
                    "Clean layouts without clutter on homepage and key pages"
                ],
                notes: "Design finalized and aligned with chapter branding."
            },
            {
                id: 3,
                category: "pages",
                title: "Homepage",
                desc: "Communicate who we are and why travel professionals should get involved with clear CTAs, About preview, Membership benefits, Upcoming events, News, Sponsors, Email signup, and Social links.",
                subitems: [
                    "Hero Section with strong intro statement and CTAs (Join Us, Upcoming Events, Learn More)",
                    "About PTANA Metro ATL chapter overview & mission",
                    "Membership benefits with prominent join button",
                    "Upcoming Events display & Chapter News preview",
                    "Suppliers recognition, email subscriber signup & Social links"
                ],
                notes: "Published with all mandatory hero and section elements."
            },
            {
                id: 4,
                category: "pages",
                title: "About Us Page",
                desc: "Explain who PTANA Metro ATL is, mission, purpose, audience served, value of participation, and connection to the travel professional community.",
                subitems: [
                    "Clear mission and chapter purpose statement",
                    "Target audience and travel community connection",
                    "Encourages travel agents to become involved"
                ],
                notes: "Published successfully."
            },
            {
                id: 5,
                category: "pages",
                title: "Leadership Page",
                desc: "Feature current chapter officers and board members with professional photo, name, title, company/agency, short bio, and contact info.",
                subitems: [
                    "Professional photo and title for each officer",
                    "Company/agency affiliation and short bio",
                    "Easy for administrator to update as leadership changes"
                ],
                notes: "Published and ready for annual updates."
            },
            {
                id: 6,
                category: "pages",
                title: "Membership Page",
                desc: "Explain membership eligibility, benefits (networking, supplier relationships, education, training, meetings), how to join, secure online payment, and confirmation notifications.",
                subitems: [
                    "Who can join & membership categories",
                    "Detailed membership benefits list",
                    "Clear joining instructions and secure online payment",
                    "Applicant confirmation and administrator notification"
                ],
                notes: "Critical membership hub active."
            },
            {
                id: 9,
                category: "pages",
                title: "Member Resources",
                desc: "Repository for chapter documents, educational materials, supplier info, meeting presentations, training, forms, and links with easy addition and optional member login protection.",
                subitems: [
                    "Chapter documents and educational materials",
                    "Supplier info and meeting presentations",
                    "Password-protected / member login solution recommendation"
                ],
                notes: "Member resources section published."
            },
            {
                id: 10,
                category: "pages",
                title: "Supplier / Partner Section",
                desc: "Display travel suppliers, partners, and sponsors with company logo, name, short description, website link, agent contact info, and special offers.",
                subitems: [
                    "Company logo, description, and website link",
                    "Travel agent contact person and details",
                    "Easy addition/removal capability for admins"
                ],
                notes: "Published and recognized."
            },
            {
                id: 11,
                category: "pages",
                title: "News and Announcements",
                desc: "News/Blog section for chapter announcements, industry news, meeting recaps, member highlights, supplier updates, and educational opportunities with social sharing.",
                subitems: [
                    "Chapter announcements and industry news",
                    "Meeting recaps and member highlights",
                    "Social-sharing capabilities"
                ],
                notes: "Active blog/news feed published."
            },
            {
                id: 12,
                category: "pages",
                title: "Photo Gallery",
                desc: "Organized gallery for photos from meetings, networking, conferences, FAM trips, supplier events, and community activities with optimized image sizes.",
                subitems: [
                    "Categorized event and FAM trip photos",
                    "Easy to update for administrators",
                    "Optimized images for fast loading speed"
                ],
                notes: "Gallery published."
            },
            {
                id: 13,
                category: "pages",
                title: "Contact Us Page",
                desc: "General contact info, contact form (name, email, phone, agency, subject, message), leadership contact details, social links, admin email delivery, and spam protection.",
                subitems: [
                    "Contact form with essential fields",
                    "Delivery to designated chapter email address",
                    "Spam protection integration"
                ],
                notes: "Contact page published with spam filtering."
            },
            {
                id: 15,
                category: "technical",
                title: "Social Media Integration",
                desc: "Clearly visible links to active social media accounts with correct routing, easy updates, and article/event social sharing.",
                subitems: [
                    "Links to active chapter social platforms",
                    "Easy update capability",
                    "Shareable articles and events"
                ],
                notes: "Social links active and verified."
            },
            {
                id: 16,
                category: "technical",
                title: "Mobile Responsiveness",
                desc: "Ensure flawless operation across desktop, laptops, tablets, and smartphones, specifically testing navigation, forms, registration, buttons, images, calendars, and text readability.",
                subitems: [
                    "Responsive layout across all devices",
                    "Optimized navigation and forms on mobile",
                    "Thorough mobile testing before launch"
                ],
                notes: "Tested and confirmed across major viewports."
            }
        ];

        let currentFilter = 'all';
        let searchQuery = '';

        function filterCategory(cat) {
            currentFilter = cat;
            ['all', 'pages', 'technical'].forEach(c => {
                const btn = document.getElementById(`filter-${c}`);
                if(c === cat) {
                    btn.className = "filter-btn px-4 py-2 text-xs font-semibold rounded-xl bg-navy text-white transition shadow-sm";
                } else {
                    btn.className = "filter-btn px-4 py-2 text-xs font-semibold rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                }
            });
            renderCompletedTasks();
        }

        function handleSearch(e) {
            searchQuery = e.target.value.toLowerCase();
            renderCompletedTasks();
        }

        function renderCompletedTasks() {
            const container = document.getElementById('completed-grid');
            container.innerHTML = '';

            const filtered = completedTasks.filter(task => {
                const matchesSearch = task.title.toLowerCase().includes(searchQuery) || task.desc.toLowerCase().includes(searchQuery) || task.id.toString().includes(searchQuery);
                if(!matchesSearch) return false;
                if(currentFilter === 'all') return true;
                return task.category === currentFilter;
            });

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-white p-12 rounded-2xl text-center border border-slate-200 text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
                        <p class="text-sm font-medium">No completed milestones found matching your search.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(task => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition";
                
                let subitemsHtml = '';
                task.subitems.forEach(sub => {
                    subitemsHtml += `<li class="flex items-start space-x-2 text-xs text-slate-600 bg-slate-50 p-2 rounded-lg"><i class="fa-solid fa-circle-check text-emerald-600 mt-0.5"></i><span>${sub}</span></li>`;
                });

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2.5 py-1 rounded-lg">Task #${task.id}</span>
                            <span class="text-xs font-semibold px-3 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 inline-flex items-center gap-1.5">
                                <i class="fa-solid fa-circle-check"></i> Completed & Published
                            </span>
                        </div>
                        <h3 class="text-lg font-bold text-navy mb-2">${task.title}</h3>
                        <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-4">${task.desc}</p>
                        <div class="space-y-2 mb-4">
                            <h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Key Deliverables:</h4>
                            <ul class="space-y-1.5">${subitemsHtml}</ul>
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                        <span><i class="fa-solid fa-note-sticky text-amber mr-1"></i> ${task.notes}</span>
                        <span class="font-semibold text-emerald-600"><i class="fa-solid fa-check-double mr-1"></i> Verified</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = function() {
            renderCompletedTasks();
        }
    </script>
</body>
</html>
